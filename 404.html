<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Indusha &amp; Anjana</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #16241e;
  --bg-deep: #0f1a15;
  --ink: #ece2cd;
  --muted: #b5ae9b;
  --accent: #c8a56a;
  --paper: #f3ead8;
  --paper-ink: #2a2a24;
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { min-height: 100%; background: var(--bg-deep); }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 20%, var(--bg) 0%, var(--bg-deep) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-items: center;
  padding: 2rem 1.25rem;
}

a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.page {
  width: 100%;
  max-width: 36rem;
  text-align: center;
  border: 1px solid rgba(200, 165, 106, 0.45);
  outline: 1px solid rgba(200, 165, 106, 0.18);
  outline-offset: 8px;
  padding: clamp(2.5rem, 8vw, 4.5rem) clamp(1.5rem, 6vw, 3.5rem);
  animation: settle 1.2s ease-out both;
}

.kicker {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 0.8rem;
  letter-spacing: 0.28em;
  color: var(--accent);
  margin-bottom: 2rem;
}

.names {
  font-weight: 300;
  line-height: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1.names { font-size: clamp(3.25rem, 14vw, 5.5rem); }
h2.names { font-size: clamp(2.6rem, 11vw, 4rem); margin: 0.9rem 0 1.5rem; }
.names .amp {
  font-style: italic;
  font-size: 0.55em;
  color: var(--accent);
  margin: 0.15em 0;
}

.tagline, .date-line {
  margin-top: 1.75rem;
  font-style: italic;
  font-size: 1.35rem;
  line-height: 1.5;
  color: var(--muted);
}

.rule {
  width: 3.5rem;
  border: 0;
  border-top: 1px solid var(--accent);
  margin: 2.5rem auto;
}

.note h2, .block h3 {
  font-weight: 400;
  font-size: 1.6rem;
  margin-bottom: 0.9rem;
}
.note p, .body-copy {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 0.95rem;
  line-height: 1.8;
  color: var(--muted);
  max-width: 26rem;
  margin: 0 auto;
}
.sign {
  margin-top: 2.25rem;
  font-style: italic;
  font-size: 1.15rem;
  color: var(--accent);
}

/* ---------- buttons ---------- */
.btn {
  display: inline-block;
  font-family: var(--sans);
  font-weight: 400;
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  text-decoration: none;
  color: var(--bg-deep);
  background: var(--accent);
  border: 1px solid var(--accent);
  padding: 0.8rem 1.6rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn:hover { background: transparent; color: var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent); color: var(--bg-deep); }
.btn-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }

/* ---------- homecoming ---------- */
.event-line { font-size: 1.3rem; line-height: 1.5; }
.event-line + .event-line { color: var(--muted); font-style: italic; font-size: 1.15rem; }

.counting {
  margin-top: 2.25rem;
  font-style: italic;
  color: var(--accent);
  font-size: 1.1rem;
}
.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.5rem;
  margin: 1.1rem auto 2rem;
  max-width: 24rem;
}
.countdown div {
  border: 1px solid rgba(200, 165, 106, 0.35);
  padding: 0.9rem 0.25rem 0.7rem;
}
.countdown b {
  display: block;
  font-weight: 300;
  font-size: clamp(1.8rem, 8vw, 2.4rem);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.countdown span {
  display: block;
  margin-top: 0.4rem;
  font-family: var(--sans);
  font-weight: 300;
  font-size: 0.72rem;
  color: var(--muted);
}
.celebrated { font-size: 1.3rem; font-style: italic; color: var(--accent); margin: 1.75rem 0 2rem; }

.hosts p { font-size: 1.5rem; line-height: 1.35; }
.hosts .together { font-style: italic; font-size: 1.1rem; color: var(--accent); margin: 0.5rem 0; }

.details { display: grid; gap: 1.75rem; margin-top: 1.5rem; }
.details dt { font-style: italic; color: var(--accent); font-size: 1.05rem; margin-bottom: 0.25rem; }
.details dd { font-size: 1.35rem; line-height: 1.4; }
.details dd small { display: block; font-size: 1.05rem; color: var(--muted); }
.details .btn { margin-top: 0.9rem; }

/* ---------- wedding envelope ---------- */
.envelope-wrap { margin: 2.5rem auto 0; min-height: 15rem; }
.envelope {
  position: relative;
  width: min(18rem, 100%);
  height: 12rem;
  margin: 0 auto 2rem;
  background: #1f3329;
  border: 1px solid var(--accent);
  perspective: 700px;
}
.envelope::before {                 /* envelope sides + bottom fold */
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(to top right, transparent 49.6%, rgba(200,165,106,.45) 50%, transparent 50.4%) left / 50% 100% no-repeat,
    linear-gradient(to top left,  transparent 49.6%, rgba(200,165,106,.45) 50%, transparent 50.4%) right / 50% 100% no-repeat;
}
.flap {
  position: absolute; top: -1px; left: -1px; right: -1px;
  height: 6.6rem;
  background: #2a4336;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform 0.9s ease;
  border-top: 1px solid var(--accent);
}
.seal {
  position: absolute; left: 50%; top: 5.3rem; translate: -50% 0;
  width: 2.2rem; height: 2.2rem; border-radius: 50%;
  background: var(--accent); color: var(--bg-deep);
  display: grid; place-items: center; font-size: 1.1rem;
  transition: opacity 0.4s;
}
.envelope.open .flap { transform: rotateX(180deg); }
.envelope.open .seal { opacity: 0; }

.card {
  background: var(--paper);
  color: var(--paper-ink);
  padding: 2.5rem 1.5rem;
  border: 1px solid var(--accent);
  outline: 1px solid rgba(200,165,106,.6);
  outline-offset: -8px;
  animation: settle 1s ease-out both;
}
.card .small { font-style: italic; font-size: 1.2rem; color: #6b6148; }
.card .names { margin: 1.2rem 0 1.2rem; }
.card .names .amp { color: #9a7a3e; }
.card .date-line { color: #4a4636; margin-top: 0; font-size: 1.5rem; }
.card .more { margin-top: 1.75rem; }
.card .btn { color: var(--paper-ink); border-color: #9a7a3e; background: transparent; }
.card .btn:hover { background: #9a7a3e; color: var(--paper); }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

@keyframes settle {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .page, .card { animation: none; }
  .flap { transition: none; }
}

/* optional photo envelope (envelope-closed.webp / envelope-open.webp) */
.env-photo {
  display: block;
  width: min(24rem, 100%);
  height: auto;
  margin: 0 auto 2rem;
  animation: settle 1s ease-out both;
}
.env-photo[hidden], .envelope[hidden] { display: none; }
</style>
</head>
<body>
  <main class="page">
    <h1 class="names" style="font-size:2.6rem">Page not found</h1>
    <p class="tagline">This invitation link doesn’t seem to exist.<br>Please check the link you were sent.</p>
    <hr class="rule">
    <a class="btn ghost" href="./">Go to the home page</a>
  </main>
</body>
</html>
