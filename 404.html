<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Indusha &amp; Anjana</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Works for both user sites (/) and project sites (/repo-name/)
    var seg = location.pathname.split('/')[1];
    var isProject = location.hostname.endsWith('github.io') && seg && !/^(wedding|homecoming)$/.test(seg);
    var base = isProject ? '/' + seg + '/' : '/';
    document.write('<base href="' + base + '">');
  </script>
</head>
<body>
  <main class="page">
    <h1 class="names" style="font-size:2.6rem">Page not found</h1>
    <p class="tagline">This invitation link doesn’t seem to exist.<br>Please check the link you were sent.</p>
    <hr class="rule">
    <a class="btn ghost" href="./">Go to the home page</a>
  </main>
</body>
</html>
